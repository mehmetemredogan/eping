name: UI Release

# Two ways to cut a release:
#
# 1. Tag push (normal flow): `git tag v0.2 && git push origin v0.2`.
#    The version is taken from the tag name.
#
# 2. Manual dispatch (Actions tab -> UI Release -> Run workflow):
#    - Leave "version" empty to release whatever is currently in `ui/VERSION`.
#    - Or set "version" to release a specific ad-hoc version (e.g. v0.2-rc1).
#    In both cases a real release is published — the tag is created
#    automatically (by softprops/action-gh-release) if it doesn't exist yet,
#    pointing at the commit that triggered the run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v0.2). Leave empty to use ui/VERSION.'
        required: false

permissions:
  contents: write

defaults:
  run:
    working-directory: ui

jobs:
  # Resolves a single version string used by every other job, regardless of
  # how the workflow was triggered. This used to be computed independently
  # inside each build matrix leg (and only worked for tag pushes), which is
  # why manual runs never produced a release.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            echo "Triggered by tag push: using ${version}"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
            echo "Triggered manually with explicit version: ${version}"
          else
            version="v$(tr -d '[:space:]' < VERSION)"
            echo "Triggered manually without input: using ui/VERSION -> ${version}"
          fi

          # Normalize so callers can pass "0.2" or "v0.2" interchangeably.
          if [[ ! "$version" =~ ^v ]]; then
            version="v${version}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${version}' doesn't look like a valid version (expected e.g. v0.1, v1.2.3, v0.2-rc1)."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### Release version: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ui/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -v

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ui/go.sum

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          mkdir -p dist
          go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/eping${ext}" .

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          name="eping-${{ matrix.goos }}-${{ matrix.goarch }}"
          pkg="dist/${name}"
          mkdir -p "$pkg"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv dist/eping.exe "$pkg/eping.exe"
          else
            mv dist/eping "$pkg/eping"
          fi
          cp README.md README.en.md config.yaml.example "$pkg/" 2>/dev/null || true
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -r "${name}.zip" "${name}")
          else
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eping-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ui/dist/*.zip
            ui/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: eping ${{ needs.prepare.outputs.version }}
          # A tag is created automatically (pointing at the triggering commit)
          # if it doesn't already exist — this is what makes manual dispatch
          # runs work without requiring a pre-existing tag.
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ startsWith(needs.prepare.outputs.version, 'v0.') }}

      - name: Summary
        # Override the job-wide `working-directory: ui` default: this job never
        # checks out the repo, so no `ui/` directory exists on the runner.
        working-directory: .
        run: |
          echo "Published release **${{ needs.prepare.outputs.version }}**." >> "$GITHUB_STEP_SUMMARY"
