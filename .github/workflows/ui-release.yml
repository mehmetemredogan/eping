name: UI Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0). Defaults to a dev build.'
        required: false

permissions:
  contents: write

defaults:
  run:
    working-directory: ui

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ui/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -v

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ui/go.sum

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          mkdir -p dist
          go build -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "dist/eping${ext}" .

      - name: Package archive
        shell: bash
        run: |
          name="eping-${{ matrix.goos }}-${{ matrix.goarch }}"
          pkg="dist/${name}"
          mkdir -p "$pkg"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv dist/eping.exe "$pkg/eping.exe"
          else
            mv dist/eping "$pkg/eping"
          fi
          cp README.md README.en.md config.yaml.example "$pkg/" 2>/dev/null || true
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -r "${name}.zip" "${name}")
          else
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eping-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ui/dist/*.zip
            ui/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
